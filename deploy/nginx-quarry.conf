# /etc/nginx/sites-available/quarry  (ln -s into sites-enabled, then: certbot --nginx -d quarry.daevil1.com)
server {
    listen 80;
    listen [::]:80;
    server_name quarry.daevil1.com;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # a picture is up to 25 MB (docs/SPEC.md §17.4)
        client_max_body_size 30m;
    }

    # exporting and restoring a large world (thousands of entries, and its pictures) takes longer than a page, and
    # an export with its pictures can be up to 1 GB (docs/SPEC.md §17.6)
    location ~ ^/api/worlds/(restore|[^/]+/export)$ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 1g;
        proxy_request_buffering off;
    }
}
