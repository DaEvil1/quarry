[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry"
version = "0.1.0"
description = "A writing environment for long fiction set in shared worlds"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "webauthn>=3.0,<4",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "httpx>=0.27"]

[project.scripts]
quarry = "quarry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quarry = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
