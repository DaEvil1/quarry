# Tests, the end-to-end run and (on master) the Docker image, pushed to ghcr.io/<owner>/quarry for the droplet.
# The runner image is pinned (ubuntu-latest moves to a new Ubuntu now and then); bump it on purpose.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quarry
          POSTGRES_PASSWORD: quarry
          POSTGRES_DB: quarry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quarry" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: backend tests
        working-directory: backend
        env:
          QUARRY_TEST_DATABASE_URL: postgresql://quarry:quarry@localhost:5432/quarry
        run: |
          pip install -q -e ".[dev]"
          python -m pytest -q

      - name: frontend typecheck, unit tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: end to end
        working-directory: frontend
        env:
          QUARRY_DATABASE_URL: postgresql://quarry:quarry@localhost:5432/quarry_e2e
          QUARRY_BASE_URL: http://localhost:8767
          QUARRY_SETUP_TOKEN: e2e-setup-token
          QUARRY_AUTH_RATE_LIMIT: "1000"
          QUARRY_PORT: "8767"
          PGPASSWORD: quarry
        run: |
          npx playwright install --with-deps --only-shell chromium
          psql -h localhost -U quarry -d quarry -c "CREATE DATABASE quarry_e2e"
          (QUARRY_WEB_DIR="$PWD/dist" quarry serve > server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:8767/healthz && break; sleep 1; done
          npx playwright test || (tail -50 server.log; exit 1)

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
