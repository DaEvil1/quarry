# The Guide's walkthroughs as videos (docs/SPEC.md §15): each watched at normal speed in a fresh Quarry and recorded,
# squeezed with VP9 (about 1.5 MB a minute, some 35 MB for all of them), then kept as a workflow artifact for 30
# days. Run by hand (Actions › guide videos › Run workflow); nothing is committed, so the videos take no room in the
# repository.
name: guide videos

on:
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quarry
          POSTGRES_PASSWORD: quarry
          POSTGRES_DB: quarry_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quarry" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install and build
        run: |
          pip install -q -e backend
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps --only-shell chromium
          npx vite build
      - name: record
        working-directory: frontend
        env:
          QUARRY_DATABASE_URL: postgresql://quarry:quarry@localhost:5432/quarry_e2e
          QUARRY_BASE_URL: http://localhost:8767
          QUARRY_SETUP_TOKEN: e2e-setup-token
          QUARRY_AUTH_RATE_LIMIT: "1000"
          QUARRY_PORT: "8767"
          E2E_SHARD: guide
          GUIDE_VIDEO: guide-videos
        run: |
          (QUARRY_WEB_DIR="$PWD/dist" quarry serve > server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:8767/healthz && break; sleep 1; done
          npx playwright test --project=guide || (tail -50 server.log; exit 1)
      # Playwright records at a high bitrate; screen video squeezes six times smaller with no visible loss
      - name: compress
        working-directory: frontend/guide-videos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir small
          for f in *.webm; do ffmpeg -hide_banner -loglevel error -i "$f" -c:v libvpx-vp9 -crf 42 -b:v 0 -row-mt 1 -deadline good -cpu-used 4 -an "small/$f"; done
          du -sh small
      - uses: actions/upload-artifact@v4
        with:
          name: guide-videos
          path: frontend/guide-videos/small/*.webm
          retention-days: 30
